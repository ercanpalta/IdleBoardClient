name: Build and Release Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Portable Client
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore IdleBoardClient/IdleBoardClient.csproj

      - name: Publish Portable Client (win-x64)
        run: |
          dotnet publish IdleBoardClient/IdleBoardClient.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath IdleBoardClient-win-x64.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: IdleBoardClient-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
